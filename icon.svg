<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Liftbook icon: barbell end on an orange gradient, smoked-glass plates and a frosted arrow. Full-bleed square; iOS rounds the corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb24f"/>
      <stop offset=".45" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#d9260f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".1" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdff"/>
      <stop offset=".35" stop-color="#b9b8c4"/>
      <stop offset=".55" stop-color="#f3f2f7"/>
      <stop offset="1" stop-color="#6b6878"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b7f96"/>
      <stop offset=".25" stop-color="#3a3a4a"/>
      <stop offset=".7" stop-color="#1d1c26"/>
      <stop offset="1" stop-color="#4a4658"/>
    </linearGradient>
    <linearGradient id="plateShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb08a" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc4ff"/>
      <stop offset=".5" stop-color="#1f74ff"/>
      <stop offset="1" stop-color="#0b3fb0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="18" dy="26" stdDeviation="26" flood-color="#5a0a00" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- frosted arrow -->
  <path d="M300,0 H600 L930,440 Q984,512 930,584 L600,1024 H300 Z" fill="#b8200c" opacity=".32"/>
  <path d="M300,0 H600 L930,440 Q984,512 930,584 L600,1024 H300 Z" fill="url(#glass)"/>
  <path d="M300,0 H600 L930,440 Q984,512 930,584 L600,1024" fill="none" stroke="url(#glassEdge)" stroke-width="5"/>

  <!-- bar -->
  <rect x="-20" y="470" width="470" height="84" rx="14" fill="url(#chrome)" filter="url(#shadow)"/>
  <rect x="610" y="478" width="210" height="68" rx="22" fill="url(#chrome)" filter="url(#shadow)"/>
  <rect x="640" y="484" width="170" height="10" rx="5" fill="#fff" opacity=".8"/>

  <!-- plates -->
  <g filter="url(#shadow)">
    <rect x="520" y="250" width="110" height="524" rx="42" fill="url(#plate)"/>
    <rect x="520" y="250" width="110" height="524" rx="42" fill="url(#plateShine)"/>
    <rect x="522" y="252" width="106" height="520" rx="40" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
    <rect x="345" y="150" width="190" height="724" rx="62" fill="url(#plate)"/>
    <rect x="345" y="150" width="190" height="724" rx="62" fill="url(#plateShine)"/>
    <rect x="348" y="153" width="184" height="718" rx="59" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="4"/>
    <rect x="372" y="190" width="18" height="640" rx="9" fill="#fff" opacity=".22" filter="url(#soft)"/>
  </g>

  <!-- collar -->
  <rect x="628" y="452" width="40" height="120" rx="14" fill="url(#collar)"/>
  <rect x="634" y="458" width="10" height="108" rx="5" fill="#fff" opacity=".45"/>
</svg>
